<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">1フレーム = OFF → 左ON → 右ON</title><desc id="desc">背景光を共通に用いて左右それぞれの差分を計算する3相の順次測定。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#526578"/></marker></defs><style>text{font-family:system-ui,-apple-system,'Hiragino Sans',sans-serif;fill:#163047;font-size:18px}.title{font-size:28px;font-weight:700}.small{font-size:15px}.label{font-size:20px;font-weight:600}</style><rect width="1000" height="560" rx="18" fill="#f6f8fc"/><text x="35" y="48" class="title">1フレーム = OFF → 左ON → 右ON</text><rect x="210" y="95" width="225" height="245" rx="12" fill="#e3efff" stroke="#a8bacb"/><text x="226" y="129" class="label">① 背景光</text><text x="232" y="178" class="">OFF</text><text x="232" y="233" class="">OFF</text><text x="232" y="298" class="">18点 × ADC平均</text><line x1="437" y1="120" x2="452" y2="120" stroke="#526578" stroke-width="2" marker-end="url(#arrow)"/><rect x="455" y="95" width="225" height="245" rx="12" fill="#e3efff" stroke="#a8bacb"/><text x="471" y="129" class="label">② 左照明</text><text x="477" y="178" class="">ON</text><text x="477" y="233" class="">OFF</text><text x="477" y="298" class="">18点 × ADC平均</text><line x1="682" y1="120" x2="697" y2="120" stroke="#526578" stroke-width="2" marker-end="url(#arrow)"/><rect x="700" y="95" width="225" height="245" rx="12" fill="#e3efff" stroke="#a8bacb"/><text x="716" y="129" class="label">③ 右照明</text><text x="722" y="178" class="">OFF</text><text x="722" y="233" class="">ON</text><text x="722" y="298" class="">18点 × ADC平均</text><text x="40" y="178" class="">左LED</text><text x="40" y="233" class="">右LED</text><text x="40" y="298" class="">受光値</text><text x="210" y="382" class="">左信号 = OFF − LeftON</text><text x="560" y="382" class="">右信号 = OFF − RightON</text><text x="35" y="434" class="">各相：LED切替 → 整定待ち → MUX選択・待ち → ADC取得</text><text x="35" y="476" class="small">順次取得のため、背景光の変動と物体の移動が相間の差に混ざる。</text><text x="35" y="506" class="small">待ち時間は仮設定。走査時間とフレーム開始間隔を実測して調整する。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">蚊の形ではなく、影の振る舞いを検出</title><desc id="desc">18点の受光配列で、影の出現、隣接点への移動、影が見えている間の吸引開始を示す3フレーム。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#526578" /></marker></defs><style>text{font-family:system-ui,-apple-system,'Hiragino Sans',sans-serif;fill:#163047;font-size:18px}.title{font-size:28px;font-weight:700}.small{font-size:15px}.label{font-size:20px;font-weight:600}</style><rect width="1000" height="560" rx="18" fill="#f6f8fc" /><text x="35" y="48" class="title">蚊の形ではなく、影の振る舞いを検出</text><rect x="35" y="95" width="290" height="175" rx="12" fill="#fff" stroke="#a8bacb" /><text x="51" y="129" class="label">t₀：影の出現</text><circle cx="84" cy="160" r="10" fill="#dce8f1" /><circle cx="117" cy="160" r="10" fill="#dce8f1" /><circle cx="150" cy="160" r="10" fill="#dce8f1" /><circle cx="183" cy="160" r="10" fill="#dce8f1" /><circle cx="216" cy="160" r="10" fill="#dce8f1" /><circle cx="249" cy="160" r="10" fill="#dce8f1" /><circle cx="96" cy="197" r="10" fill="#dce8f1" /><circle cx="129" cy="197" r="10" fill="#165c87" /><circle cx="162" cy="197" r="10" fill="#dce8f1" /><circle cx="195" cy="197" r="10" fill="#dce8f1" /><circle cx="228" cy="197" r="10" fill="#dce8f1" /><circle cx="261" cy="197" r="10" fill="#dce8f1" /><circle cx="84" cy="234" r="10" fill="#dce8f1" /><circle cx="117" cy="234" r="10" fill="#dce8f1" /><circle cx="150" cy="234" r="10" fill="#dce8f1" /><circle cx="183" cy="234" r="10" fill="#dce8f1" /><circle cx="216" cy="234" r="10" fill="#dce8f1" /><circle cx="249" cy="234" r="10" fill="#dce8f1" /><line x1="325" y1="175" x2="350" y2="175" stroke="#526578" stroke-width="2" marker-end="url(#arrow)" /><rect x="355" y="95" width="290" height="175" rx="12" fill="#fff" stroke="#a8bacb" /><text x="371" y="129" class="label">t₁：隣接点へ移動</text><circle cx="404" cy="160" r="10" fill="#dce8f1" /><circle cx="437" cy="160" r="10" fill="#dce8f1" /><circle cx="470" cy="160" r="10" fill="#dce8f1" /><circle cx="503" cy="160" r="10" fill="#dce8f1" /><circle cx="536" cy="160" r="10" fill="#dce8f1" /><circle cx="569" cy="160" r="10" fill="#dce8f1" /><circle cx="416" cy="197" r="10" fill="#dce8f1" /><circle cx="449" cy="197" r="10" fill="#dce8f1" /><circle cx="482" cy="197" r="10" fill="#165c87" /><circle cx="515" cy="197" r="10" fill="#dce8f1" /><circle cx="548" cy="197" r="10" fill="#dce8f1" /><circle cx="581" cy="197" r="10" fill="#dce8f1" /><circle cx="404" cy="234" r="10" fill="#dce8f1" /><circle cx="437" cy="234" r="10" fill="#dce8f1" /><circle cx="470" cy="234" r="10" fill="#dce8f1" /><circle cx="503" cy="234" r="10" fill="#dce8f1" /><circle cx="536" cy="234" r="10" fill="#dce8f1" /><circle cx="569" cy="234" r="10" fill="#dce8f1" /><line x1="645" y1="175" x2="670" y2="175" stroke="#526578" stroke-width="2" marker-end="url(#arrow)" /><rect x="675" y="95" width="290" height="175" rx="12" fill="#fff" stroke="#a8bacb" /><text x="691" y="129" class="label">t₂：吸引開始※</text><circle cx="724" cy="160" r="10" fill="#dce8f1" /><circle cx="757" cy="160" r="10" fill="#dce8f1" /><circle cx="790" cy="160" r="10" fill="#dce8f1" /><circle cx="823" cy="160" r="10" fill="#dce8f1" /><circle cx="856" cy="160" r="10" fill="#dce8f1" /><circle cx="889" cy="160" r="10" fill="#dce8f1" /><circle cx="736" cy="197" r="10" fill="#dce8f1" /><circle cx="769" cy="197" r="10" fill="#dce8f1" /><circle cx="802" cy="197" r="10" fill="#dce8f1" /><circle cx="835" cy="197" r="10" fill="#165c87" /><circle cx="868" cy="197" r="10" fill="#dce8f1" /><circle cx="901" cy="197" r="10" fill="#dce8f1" /><circle cx="724" cy="234" r="10" fill="#dce8f1" /><circle cx="757" cy="234" r="10" fill="#dce8f1" /><circle cx="790" cy="234" r="10" fill="#dce8f1" /><circle cx="823" cy="234" r="10" fill="#dce8f1" /><circle cx="856" cy="234" r="10" fill="#dce8f1" /><circle cx="889" cy="234" r="10" fill="#dce8f1" /><text x="35" y="315" class="">同じLEDのフレームを追跡する。左右の照明切替を物体の移動と数えない。</text><rect x="35" y="345" width="580" height="100" rx="12" fill="#e3efff" stroke="#a8bacb" /><text x="51" y="379" class="label">小ささ ＋ 局所性 ＋ 連続した移動</text><text x="52" y="411" class="">移動を確認 → 影が見えている間に吸引開始</text><rect x="645" y="345" width="320" height="100" rx="12" fill="#e0f2e9" stroke="#a8bacb" /><text x="661" y="379" class="label">影が見えている間に起動</text><text x="662" y="411" class="">自動吸引は有効化した場合のみ</text><text x="35" y="486" class="small">静止・広い影・離れた位置への飛び移り・長い滞留を除外。</text><text x="35" y="516" class="small">※設計方針。現行コードは消失時に判定するため、実装の修正が必要。</text></svg>
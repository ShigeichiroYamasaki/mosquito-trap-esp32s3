<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" role="img" aria-labelledby="title desc"><title id="title">Deneuve 2 — 誘引・捕獲の仕組み</title><desc id="desc">人工皮膚の自然拡散とCO₂専用ファンの流路を分離し、噴出口を人工皮膚の近くに配置する。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#49697f"/></marker></defs><style>text{font-family:system-ui,-apple-system,"Hiragino Sans",sans-serif;fill:#163047}.line{fill:none;stroke:#49697f;stroke-width:2.5}</style><rect width="1000" height="900" rx="18" fill="#f6f8fc"/><text x="30" y="44" font-size="28">Deneuve 2 — 誘引・捕獲の仕組み</text><text x="30" y="78" font-size="18">人工皮膚の温度・匂いと、CO₂の濃度変動を別々に調整する</text><rect x="30" y="110" width="430" height="116" rx="12" fill="#fff" stroke="#a8bacb"/><text x="46" y="140" font-size="21">CO₂発生部</text><text x="46" y="169" font-size="18">クエン酸水溶液を重曹へ滴下</text><text x="46" y="195" font-size="18">発生ガスの出口を塞がない</text><rect x="540" y="110" width="430" height="116" rx="12" fill="#fff" stroke="#a8bacb"/><text x="556" y="140" font-size="21">555タイマー → 駆動回路</text><text x="556" y="169" font-size="18">専用5Vファンを間欠運転</text><text x="556" y="195" font-size="18">4〜6秒間隔は仮設定・実測で調整</text><rect x="30" y="280" width="430" height="116" rx="12" fill="#e9f5ff" stroke="#a8bacb"/><text x="46" y="310" font-size="21">開放された混合部 ＋ CO₂専用ファン</text><text x="46" y="339" font-size="18">CO₂と外気を混合して送り出す</text><text x="46" y="365" font-size="18">停止中もガスが逃げる流路を確保</text><polyline points="245,226 245,280" class="line" marker-end="url(#a)"/><polyline points="755,226 755,250 440,250 440,280" class="line" marker-end="url(#a)"/><rect x="540" y="280" width="430" height="116" rx="12" fill="#fff1e8" stroke="#a8bacb"/><text x="556" y="310" font-size="21">人工皮膚：10cm角ケース</text><text x="556" y="339" font-size="18">使用済み靴下を36°Cに保温</text><text x="556" y="365" font-size="18">匂いは自然拡散を基本とする</text><rect x="30" y="450" width="430" height="100" rx="12" fill="#e9f5ff" stroke="#a8bacb"/><text x="46" y="480" font-size="21">CO₂噴出口</text><text x="46" y="509" font-size="18">人工皮膚ケースの近くに配置</text><polyline points="245,396 245,450" class="line" marker-end="url(#a)"/><rect x="540" y="450" width="430" height="100" rx="12" fill="#edf7ee" stroke="#a8bacb"/><text x="556" y="480" font-size="21">人工皮膚の周辺へ蚊を誘引</text><text x="556" y="509" font-size="18">CO₂の風を靴下へ直接当てない</text><polyline points="755,396 755,450" class="line" marker-end="url(#a)"/><polyline points="460,502 540,502" class="line" marker-end="url(#a)"/><text x="30" y="593" font-size="18">配置条件：噴出口の距離・向き・風量は、温度とCO₂濃度波形を測って決める。</text><text x="30" y="624" font-size="18">必要なら人工皮膚側に独立した弱い連続送風を追加する（CO₂ファンとは別系統）。</text><rect x="540" y="660" width="430" height="115" rx="12" fill="#fff" stroke="#a8bacb"/><text x="556" y="690" font-size="21">赤外線による影の検出</text><text x="556" y="719" font-size="18">左右IR LED × 18受光素子</text><text x="556" y="745" font-size="18">影の消失を待たず、移動中に吸引開始</text><polyline points="755,550 755,660" class="line" marker-end="url(#a)"/><rect x="30" y="660" width="430" height="115" rx="12" fill="#fff" stroke="#a8bacb"/><text x="46" y="690" font-size="21">サーボ → 掃除機</text><text x="46" y="719" font-size="18">2回押す → 強吸引</text><text x="46" y="745" font-size="18">吸引後、さらに1回押して停止</text><polyline points="540,718 460,718" class="line" marker-end="url(#a)"/><text x="30" y="817" font-size="18">6時間・200mL/分（標準状態）の理論量：重曹270g、無水クエン酸206g。</text><text x="30" y="847" font-size="18">水溶液の最終体積1.03L、滴下2.86mL/分が目安。実際のCO₂流量で調整する。</text><text x="30" y="878" font-size="16">吸引開始の図は設計を示す。現行実行プログラムの消失待ち処理は変更が必要。</text></svg>
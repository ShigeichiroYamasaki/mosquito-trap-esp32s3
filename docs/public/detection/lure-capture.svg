<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc"><title id="title">Deneuve 2の誘引捕獲システム</title><desc id="desc">クエン酸を重曹へ滴下してCO2を生成し、人工皮膚とファンで誘引。複眼方式で影を検出し、サーボで掃除機を操作する。6時間分の理論量を併記。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#49697f"/></marker></defs><style>text{font-family:system-ui,-apple-system,"Hiragino Sans",sans-serif;fill:#163047}</style><rect width="1000" height="700" rx="18" fill="#f6f8fc"/><text x="30" y="42" font-size="28">Deneuve 2：誘引から捕獲まで</text><rect x="30" y="75" width="420" height="120" rx="12" fill="#e5effb" stroke="#a8bacb"/><text x="46" y="105" font-size="21">① クエン酸水溶液を滴下</text><text x="46" y="135" font-size="18">無水206g（または一水和物225g）</text><text x="46" y="162" font-size="18">全量約1.03L ／ 約2.86mL/分</text><path d="M230 195 L230 240" fill="none" stroke="#49697f" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="245" width="420" height="115" rx="12" fill="#e5effb" stroke="#a8bacb"/><text x="46" y="275" font-size="21">② 重曹と反応してCO₂を生成</text><text x="46" y="305" font-size="18">重曹 約270g ／ 6時間分</text><text x="46" y="332" font-size="18">目標：200mL/分（標準状態換算）</text><path d="M450 300 L540 300" fill="none" stroke="#49697f" stroke-width="2" marker-end="url(#a)"/><text x="465" y="285" font-size="17">CO₂</text><rect x="550" y="245" width="420" height="145" rx="12" fill="#e0f2e9" stroke="#a8bacb"/><text x="566" y="275" font-size="21">③ 誘引ケース（10cm角）</text><text x="566" y="305" font-size="18">CO₂噴出口 ＋ 人工皮膚</text><text x="566" y="332" font-size="18">半日以上履いた靴下 ＋ 36℃ヒーター</text><text x="566" y="359" font-size="18">匂い・CO₂を下面ファンで拡散</text><rect x="550" y="75" width="420" height="110" rx="12" fill="#e0f2e9" stroke="#a8bacb"/><text x="566" y="105" font-size="21">555タイマー → 5V拡散ファン</text><text x="566" y="135" font-size="18">4〜6秒間隔のリズム</text><text x="566" y="162" font-size="18">CO₂生成の停止制御ではない</text><path d="M760 185 L760 240" fill="none" stroke="#49697f" stroke-width="2" marker-end="url(#a)"/><path d="M760 390 L760 430" fill="none" stroke="#49697f" stroke-width="2" marker-end="url(#a)"/><rect x="550" y="435" width="420" height="115" rx="12" fill="#e5effb" stroke="#a8bacb"/><text x="566" y="465" font-size="21">④ 蚊が接近 → 影を検出</text><text x="566" y="495" font-size="18">左右IR LED ＋ 18点の受光配列</text><text x="566" y="522" font-size="18">ESP32-S3：小さく局所的な移動を判定</text><path d="M545 493 L455 493" fill="none" stroke="#49697f" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="435" width="420" height="115" rx="12" fill="#fff0d9" stroke="#a8bacb"/><text x="46" y="465" font-size="21">⑤ サーボで掃除機を操作</text><text x="46" y="495" font-size="18">2回押下 → 強吸引 → 1回押下で停止</text><text x="46" y="522" font-size="18">内部回路・モーターは改造しない</text><text x="30" y="597" font-size="17">捕獲方針：影が見えている間に吸引開始。現行コードの起動条件は修正が必要。</text><text x="30" y="632" font-size="17">材料量・流量は完全反応を仮定した理論値。噴出口で実測して調整する。</text><text x="30" y="666" font-size="16">反応容器はケースとは別に配置する例。泡・反応液の余裕を確保し、ガス出口を塞がない。</text></svg>
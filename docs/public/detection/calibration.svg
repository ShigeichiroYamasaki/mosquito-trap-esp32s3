<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" role="img" aria-labelledby="title desc"><title id="title">初期校正：左右別・受光点別に正規化</title><desc id="desc">周辺と中央で異なる受光量を基準比でそろえ、品質が不足する点は除外する。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#526578"/></marker></defs><style>text{font-family:system-ui,-apple-system,'Hiragino Sans',sans-serif;fill:#163047;font-size:18px}.title{font-size:28px;font-weight:700}.small{font-size:15px}.label{font-size:20px;font-weight:600}</style><rect width="1000" height="530" rx="18" fill="#f6f8fc"/><text x="35" y="48" class="title">初期校正：左右別・受光点別に正規化</text><rect x="35" y="95" width="285" height="95" rx="12" fill="#e3efff" stroke="#a8bacb"/><text x="51" y="129" class="label">遮蔽物なしで80フレーム</text><text x="52" y="157" class="">左右 × 18点を別々に集計</text><line x1="325" y1="140" x2="355" y2="140" stroke="#526578" stroke-width="2" marker-end="url(#arrow)"/><rect x="365" y="95" width="270" height="95" rx="12" fill="#e3efff" stroke="#a8bacb"/><text x="381" y="129" class="label">平均・ばらつき・飽和</text><text x="382" y="157" class="">基準値と有効／無効を保存</text><line x1="640" y1="140" x2="670" y2="140" stroke="#526578" stroke-width="2" marker-end="url(#arrow)"/><rect x="680" y="95" width="285" height="95" rx="12" fill="#e3efff" stroke="#a8bacb"/><text x="696" y="129" class="label">各点を基準比で補正</text><text x="697" y="157" class="">影 = 1 − 現在値 / 基準値</text><text x="40" y="238" class="label">光量差を補正する例（説明用の数値）</text><rect x="55" y="260" width="290" height="130" rx="12" fill="#fff" stroke="#a8bacb"/><text x="71" y="294" class="label">周辺の点</text><text x="71" y="325" class="">基準 100 → 遮光時 60</text><text x="71" y="365" class="">影の強さ = 0.40</text><rect x="380" y="260" width="290" height="130" rx="12" fill="#fff" stroke="#a8bacb"/><text x="396" y="294" class="label">中央の点</text><text x="396" y="325" class="">基準 1000 → 遮光時 600</text><text x="396" y="365" class="">影の強さ = 0.40</text><rect x="715" y="260" width="240" height="130" rx="12" fill="#fff2d9" stroke="#a8bacb"/><text x="731" y="294" class="label">弱い／飽和した点</text><text x="731" y="325" class="">補正で救済せず</text><text x="731" y="365" class="">検出から除外</text><text x="40" y="441" class="">均一化するのは数値の尺度。感度や信号対雑音比は均一にならない。</text><text x="40" y="481" class="small">基準値は固定。光路を空けて手動再校正し、静止物体の背景化を防ぐ。</text></svg>
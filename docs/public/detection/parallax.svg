<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">次期設計：左右照明による影の視差</title><desc id="desc">受光面を共有し、異なる位置の光源によって生じる影のずれを利用する。両眼カメラではない。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#526578"/></marker></defs><style>text{font-family:system-ui,-apple-system,'Hiragino Sans',sans-serif;fill:#163047;font-size:18px}.title{font-size:28px;font-weight:700}.small{font-size:15px}.label{font-size:20px;font-weight:600}</style><rect width="1000" height="560" rx="18" fill="#f6f8fc"/><text x="35" y="48" class="title">次期設計：左右照明による影の視差</text><rect x="35" y="90" width="450" height="315" rx="12" fill="#fff" stroke="#a8bacb"/><text x="51" y="124" class="label">左LEDのみ点灯</text><circle cx="135" cy="160" r="12" fill="#eea132"/><line x1="135" y1="160" x2="436.47058823529414" y2="365" stroke="#d69d3b" stroke-width="2"/><circle cx="260" cy="245" r="13" fill="#163047"/><text x="280" y="245" class="small">物体</text><line x1="70" y1="365" x2="450" y2="365" stroke="#526578" stroke-width="2"/><rect x="421.47058823529414" y="357" width="30" height="16" rx="4" fill="#163047"/><text x="70" y="335" class="small">同じ受光面</text><rect x="515" y="90" width="450" height="315" rx="12" fill="#fff" stroke="#a8bacb"/><text x="531" y="124" class="label">右LEDのみ点灯</text><circle cx="865" cy="160" r="12" fill="#eea132"/><line x1="865" y1="160" x2="563.5294117647059" y2="365" stroke="#d69d3b" stroke-width="2"/><circle cx="740" cy="245" r="13" fill="#163047"/><text x="760" y="245" class="small">物体</text><line x1="550" y1="365" x2="930" y2="365" stroke="#526578" stroke-width="2"/><rect x="548.5294117647059" y="357" width="30" height="16" rx="4" fill="#163047"/><text x="780" y="335" class="small">同じ受光面</text><text x="35" y="450" class="">同じ物体でも照射方向によって影の位置が変わる。図は概念図・寸法比なし。</text><text x="35" y="487" class="small">次期：LED間隔・受光面の実寸を校正し、左右取得間の移動を補正して比較。</text><text x="35" y="519" class="small">現在は奥行き推定・視差による誤検知除去を実装していない。</text></svg>
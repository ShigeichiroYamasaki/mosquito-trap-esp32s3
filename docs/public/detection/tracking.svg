r-end="url(#arrow)"/><rect x="765" y="95" width="230" height="175" rx="12" fill="#fff" stroke="#a8bacb"/><text x="781" y="129" class="label">t₃：影の消失</text><circle cx="789" cy="160" r="10" fill="#dce8f1"/><circle cx="822" cy="160" r="10" fill="#dce8f1"/><circle cx="855" cy="160" r="10" fill="#dce8f1"/><circle cx="888" cy="160" r="10" fill="#dce8f1"/><circle cx="921" cy="160" r="10" fill="#dce8f1"/><circle cx="954" cy="160" r="10" fill="#dce8f1"/><circle cx="801" cy="197" r="10" fill="#dce8f1"/><circle cx="834" cy="197" r="10" fill="#dce8f1"/><circle cx="867" cy="197" r="10" fill="#dce8f1"/><circle cx="900" cy="197" r="10" fill="#dce8f1"/><circle cx="933" cy="197" r="10" fill="#dce8f1"/><circle cx="966" cy="197" r="10" fill="#dce8f1"/><circle cx="789" cy="234" r="10" fill="#dce8f1"/><circle cx="822" cy="234" r="10" fill="#dce8f1"/><circle cx="855" cy="234" r="10" fill="#dce8f1"/><circle cx="888" cy="234" r="10" fill="#dce8f1"/><circle cx="921" cy="234" r="10" fill="#dce8f1"/><circle cx="954" cy="234" r="10" fill="#dce8f1"/><text x="35" y="315" class="">同じLEDのフレームを追跡する。左右の照明切替を物体の移動と数えない。</text><rect x="35" y="345" width="580" height="100" rx="12" fill="#e3efff" stroke="#a8bacb"/><text x="51" y="379" class="label">小ささ ＋ 局所性 ＋ 連続した移動</text><text x="52" y="411" class="">3フレーム以上を追跡 → 短時間で消失したら候補</text><rect x="645" y="345" width="320" height="100" rx="12" fill="#e0f2e9" stroke="#a8bacb"/><text x="661" y="379" class="label">候補ログ → 吸引判断</text><text x="662" y="411" class="">自動吸引は有効化した場合のみ</text><text x="35" y="486" class="small">静止・広い影・離れた位置への飛び移り・長い滞留を除外。</text><text x="35" y="516" class="small">消失確認は誤検知抑制と引き換えに起動を遅らせる。捕獲率は別途測定する。</text></svg>
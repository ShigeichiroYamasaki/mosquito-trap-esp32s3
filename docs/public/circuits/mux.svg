<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" role="img" aria-labelledby="title desc"><title id="title">02 — CD74HC4067 × 2 とESP32</title><desc id="desc">選択線4本を共有し、2本のADC入力へ順番に受光信号を渡します。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#52627b"/></marker></defs><style>text{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;fill:#172b4d;font-size:17px}.small{font-size:14px}.label{font-size:20px;font-weight:700}.title{font-size:28px;font-weight:750}.muted{fill:#52627b} .wire{fill:none;stroke:#52627b;stroke-width:2.5;stroke-linejoin:round}</style><rect width="1000" height="660" rx="18" fill="#f5f8fc"/><text x="32" y="45" class="title" text-anchor="start">02 — CD74HC4067 × 2 とESP32</text><text x="32" y="74" class="small" text-anchor="start">選択線4本を共有し、2本のADC入力へ順番に受光信号を渡します。</text><rect x="35" y="145" width="285" height="290" rx="10" fill="#ffffff" stroke="#b8c7db" stroke-width="1.5"/><text x="51" y="175" class="label" text-anchor="start">ESP32-S3 Board Lite</text><text x="60" y="255" class="" text-anchor="start">GPIO6</text><polyline points="160,250 420,250 420,495 630,495" class="wire" style="stroke:#52627b"/><polyline points="420,250 630,250" class="wire" style="stroke:#52627b"/><circle cx="420" cy="250" r="4" fill="#52627b"/><text x="560" y="242" class="small" text-anchor="start">S0</text><text x="60" y="293" class="" text-anchor="start">GPIO7</text><polyline points="160,288 445,288 445,525 630,525" class="wire" style="stroke:#52627b"/><polyline points="445,288 630,288" class="wire" style="stroke:#52627b"/><circle cx="445" cy="288" r="4" fill="#52627b"/><text x="560" y="280" class="small" text-anchor="start">S1</text><text x="60" y="331" class="" text-anchor="start">GPIO8</text><polyline points="160,326 470,326 470,555 630,555" class="wire" style="stroke:#52627b"/><polyline points="470,326 630,326" class="wire" style="stroke:#52627b"/><circle cx="470" cy="326" r="4" fill="#52627b"/><text x="560" y="318" class="small" text-anchor="start">S2</text><text x="60" y="369" class="" text-anchor="start">GPIO9</text><polyline points="160,364 495,364 495,585 630,585" class="wire" style="stroke:#52627b"/><polyline points="495,364 630,364" class="wire" style="stroke:#52627b"/><circle cx="495" cy="364" r="4" fill="#52627b"/><text x="560" y="356" class="small" text-anchor="start">S3</text><rect x="630" y="135" width="335" height="275" rx="10" fill="#ffffff" stroke="#b8c7db" stroke-width="1.5"/><text x="646" y="165" class="label" text-anchor="start">MUX1</text><text x="646" y="193" class="small" text-anchor="start">VCC → 3.3V／GND → GND</text><text x="646" y="218" class="small" text-anchor="start">EN → GND（有効）</text><rect x="630" y="450" width="335" height="160" rx="10" fill="#ffffff" stroke="#b8c7db" stroke-width="1.5"/><text x="646" y="480" class="label" text-anchor="start">MUX2</text><text x="650" y="255" class="" text-anchor="start">S0</text><text x="650" y="500" class="" text-anchor="start">S0</text><text x="650" y="293" class="" text-anchor="start">S1</text><text x="650" y="530" class="" text-anchor="start">S1</text><text x="650" y="331" class="" text-anchor="start">S2</text><text x="650" y="560" class="" text-anchor="start">S2</text><text x="650" y="369" class="" text-anchor="start">S3</text><text x="650" y="590" class="" text-anchor="start">S3</text><text x="755" y="500" class="small" text-anchor="start">VCC → 3.3V</text><text x="755" y="528" class="small" text-anchor="start">GND → GND</text><text x="755" y="556" class="small" text-anchor="start">EN → GND</text><text x="755" y="584" class="small" text-anchor="start">C0〜1：PT17〜18</text><text x="750" y="290" class="small" text-anchor="start">C0〜15：PT1〜16</text><polyline points="630,220 355,220 355,175 160,175" class="wire" style="stroke:#52627b" marker-end="url(#arrow)"/><text x="60" y="180" class="" text-anchor="start">GPIO1</text><text x="510" y="211" class="small" text-anchor="start">SIG</text><polyline points="965,470 980,470 980,110 340,110 340,210 160,210" class="wire" style="stroke:#52627b" marker-end="url(#arrow)"/><text x="60" y="215" class="" text-anchor="start">GPIO2</text><text x="835" y="105" class="small" text-anchor="start">MUX2 SIG</text><text x="35" y="635" class="small" text-anchor="start">SIG同士は接続しません。MUX2 C2〜C15はコードの読み取り対象外。全回路のGNDを共通にします。</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc"><title id="title">05 — 誘引・拡散部（機能構成図）</title><desc id="desc">555定数、ファン駆動回路、ヒーター回路は未確定。実配線図ではありません。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#52627b"/></marker></defs><style>text{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;fill:#172b4d;font-size:17px}.small{font-size:14px}.label{font-size:20px;font-weight:700}.title{font-size:28px;font-weight:750}.muted{fill:#52627b} .wire{fill:none;stroke:#52627b;stroke-width:2.5;stroke-linejoin:round}</style><rect width="1000" height="480" rx="18" fill="#f5f8fc"/><text x="32" y="45" class="title" text-anchor="start">05 — 誘引・拡散部（機能構成図）</text><text x="32" y="74" class="small" text-anchor="start">555定数、ファン駆動回路、ヒーター回路は未確定。実配線図ではありません。</text><rect x="35" y="130" width="250" height="115" rx="10" fill="#ffffff" stroke="#b8c7db" stroke-width="1.5"/><text x="51" y="160" class="label" text-anchor="start">CO₂発生部</text><text x="51" y="188" class="small" text-anchor="start">重曹＋クエン酸</text><text x="51" y="213" class="small" text-anchor="start">反応容器の配置は未確定</text><rect x="385" y="130" width="580" height="145" rx="10" fill="#ffffff" stroke="#b8c7db" stroke-width="1.5"/><text x="401" y="160" class="label" text-anchor="start">10cm角ケース</text><text x="401" y="188" class="small" text-anchor="start">CO₂噴出口＋人工皮膚</text><text x="401" y="213" class="small" text-anchor="start">半日以上履いた靴下を36°Cヒーターで加温</text><text x="401" y="238" class="small" text-anchor="start">ヒーター電源・温度制御回路は設計中</text><polyline points="285,185 385,185" class="wire" style="stroke:#52627b" marker-end="url(#arrow)" stroke-dasharray="7 5"/><rect x="35" y="330" width="250" height="105" rx="10" fill="#ffffff" stroke="#b8c7db" stroke-width="1.5"/><text x="51" y="360" class="label" text-anchor="start">555タイマーIC</text><text x="51" y="388" class="small" text-anchor="start">4〜6秒間隔のリズム</text><text x="51" y="413" class="small" text-anchor="start">定数・ON/OFF内訳は未確定</text><rect x="385" y="330" width="240" height="105" rx="10" fill="#ffffff" stroke="#b8c7db" stroke-width="1.5"/><text x="401" y="360" class="label" text-anchor="start">ファン駆動回路</text><text x="401" y="388" class="small" text-anchor="start">部品・配線は未確定</text><rect x="715" y="330" width="250" height="105" rx="10" fill="#ffffff" stroke="#b8c7db" stroke-width="1.5"/><text x="731" y="360" class="label" text-anchor="start">5V拡散ファン</text><text x="731" y="388" class="small" text-anchor="start">ケース下面に配置</text><text x="731" y="413" class="small" text-anchor="start">CO₂と匂いを拡散</text><polyline points="285,380 385,380" class="wire" style="stroke:#52627b" marker-end="url(#arrow)" stroke-dasharray="7 5"/><polyline points="625,380 715,380" class="wire" style="stroke:#52627b" marker-end="url(#arrow)" stroke-dasharray="7 5"/></svg>
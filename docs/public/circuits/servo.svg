<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc"><title id="title">04 — サーボ電源・信号と掃除機の操作</title><desc id="desc">停止状態から開始。ボタンを押すごとに、停止 → 弱 → 強 → 停止と切り替わります。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#52627b"/></marker></defs><style>text{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;fill:#172b4d;font-size:17px}.small{font-size:14px}.label{font-size:20px;font-weight:700}.title{font-size:28px;font-weight:750}.muted{fill:#52627b} .wire{fill:none;stroke:#52627b;stroke-width:2.5;stroke-linejoin:round}</style><rect width="1000" height="420" rx="18" fill="#f5f8fc"/><text x="32" y="45" class="title" text-anchor="start">04 — サーボ電源・信号と掃除機の操作</text><text x="32" y="74" class="small" text-anchor="start">停止状態から開始。ボタンを押すごとに、停止 → 弱 → 強 → 停止と切り替わります。</text><rect x="560" y="130" width="390" height="150" rx="10" fill="#ffffff" stroke="#b8c7db" stroke-width="1.5"/><text x="576" y="160" class="label" text-anchor="start">サーボモータ</text><text x="576" y="188" class="small" text-anchor="start">赤：+5V</text><text x="576" y="213" class="small" text-anchor="start">黒／茶：共通GND</text><text x="576" y="238" class="small" text-anchor="start">信号：GPIO16</text><text x="45" y="180" class="label" text-anchor="start">+5V</text><polyline points="260,175 560,175" class="wire" style="stroke:#be4d32"/><text x="45" y="220" class="label" text-anchor="start">共通GND</text><polyline points="260,215 560,215" class="wire" style="stroke:#52627b"/><text x="45" y="260" class="label" text-anchor="start">ESP32 GPIO16</text><polyline points="260,255 560,255" class="wire" style="stroke:#2475ae"/><rect x="35" y="310" width="915" height="80" rx="10" fill="#ffffff" stroke="#b8c7db" stroke-width="1.5"/><text x="51" y="340" class="label" text-anchor="start">動作シーケンス</text><text x="51" y="368" class="small" text-anchor="start">押下→解放を2回 → 強吸引 → 吸引後に押下→解放を1回 → 停止</text></svg>
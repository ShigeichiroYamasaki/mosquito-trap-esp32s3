<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc"><title id="title">01 — フォトトランジスタ受光回路</title><desc id="desc">同じ回路を18組。各受光素子に100kΩを1本ずつ接続します。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#52627b"/></marker></defs><style>text{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;fill:#172b4d;font-size:17px}.small{font-size:14px}.label{font-size:20px;font-weight:700}.title{font-size:28px;font-weight:750}.muted{fill:#52627b} .wire{fill:none;stroke:#52627b;stroke-width:2.5;stroke-linejoin:round}</style><rect width="1000" height="520" rx="18" fill="#f5f8fc"/><text x="32" y="45" class="title" text-anchor="start">01 — フォトトランジスタ受光回路</text><text x="32" y="74" class="small" text-anchor="start">同じ回路を18組。各受光素子に100kΩを1本ずつ接続します。</text><text x="260" y="130" class="label" text-anchor="middle">+3.3V</text><polyline points="260,140 260,160" class="wire" style="stroke:#be4d32"/><polyline points="260,160 260,172" class="wire" style="stroke:#52627b"/><rect x="251" y="172" width="18" height="46" fill="white" stroke="#52627b" stroke-width="2"/><polyline points="260,218 260,230" class="wire" style="stroke:#52627b"/><text x="282" y="200" class="" text-anchor="start">100kΩ</text><polyline points="260,230 260,280 260,310" class="wire" style="stroke:#52627b"/><circle cx="260" cy="280" r="4" fill="#52627b"/><rect x="165" y="310" width="240" height="95" rx="10" fill="#ffffff" stroke="#b8c7db" stroke-width="1.5"/><text x="181" y="340" class="label" text-anchor="start">フォトトランジスタ</text><text x="181" y="368" class="small" text-anchor="start">上：Collector（C）</text><text x="181" y="393" class="small" text-anchor="start">下：Emitter（E）</text><polyline points="260,405 260,430" class="wire" style="stroke:#52627b"/><polyline points="260,430 260,442" class="wire" style="stroke:#52627b"/><polyline points="243,442 277,442" class="wire" style="stroke:#52627b"/><polyline points="249,449 271,449" class="wire" style="stroke:#52627b"/><polyline points="255,456 265,456" class="wire" style="stroke:#52627b"/><polyline points="260,280 545,280" class="wire" style="stroke:#52627b" marker-end="url(#arrow)"/><rect x="545" y="240" width="400" height="150" rx="10" fill="#ffffff" stroke="#b8c7db" stroke-width="1.5"/><text x="561" y="270" class="label" text-anchor="start">MUX入力 Cn</text><text x="561" y="298" class="small" text-anchor="start">PT1〜PT16 → MUX1 C0〜C15</text><text x="561" y="323" class="small" text-anchor="start">PT17〜PT18 → MUX2 C0〜C1</text><text x="561" y="348" class="small" text-anchor="start">Moechando 940nm・5mm／横6×3</text><polyline points="70,320 150,340" class="wire" style="stroke:#52627b" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="45" y="300" class="small" text-anchor="start">入射光</text><text x="32" y="495" class="small" text-anchor="start">受光でコレクタ電圧が低下する構成。100kΩの感度は単体試験で確認、応答時間は未検証。</text></svg>
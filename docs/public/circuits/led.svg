<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 605" role="img" aria-labelledby="title desc"><title id="title">03 — 左右IR LEDのトランジスタ駆動</title><desc id="desc">左右に同じ回路を1組ずつ。GPIO HIGHで点灯、LOWで消灯する指定回路です。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#52627b"/></marker></defs><style>text{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;fill:#172b4d;font-size:17px}.small{font-size:14px}.label{font-size:20px;font-weight:700}.title{font-size:28px;font-weight:750}.muted{fill:#52627b} .wire{fill:none;stroke:#52627b;stroke-width:2.5;stroke-linejoin:round}</style><rect width="1000" height="605" rx="18" fill="#f5f8fc"/><text x="32" y="45" class="title" text-anchor="start">03 — 左右IR LEDのトランジスタ駆動</text><text x="32" y="74" class="small" text-anchor="start">左右に同じ回路を1組ずつ。GPIO HIGHで点灯、LOWで消灯する指定回路です。</text><text x="290" y="125" class="label" text-anchor="middle">左 IR LED</text><text x="290" y="160" class="" text-anchor="middle">+5V</text><polyline points="290,170 290,180" class="wire" style="stroke:#be4d32"/><polyline points="290,180 290,192" class="wire" style="stroke:#52627b"/><rect x="281" y="192" width="18" height="46" fill="white" stroke="#52627b" stroke-width="2"/><polyline points="290,238 290,250" class="wire" style="stroke:#52627b"/><text x="312" y="220" class="" text-anchor="start">330Ω</text><polyline points="290,250 290,270" class="wire" style="stroke:#52627b"/><rect x="225" y="270" width="130" height="78" rx="10" fill="#ffffff" stroke="#b8c7db" stroke-width="1.5"/><text x="241" y="300" class="label" text-anchor="start">IR LED</text><text x="241" y="328" class="small" text-anchor="start">上 A／下 K</text><polyline points="290,348 290,380" class="wire" style="stroke:#52627b"/><rect x="230" y="380" width="130" height="90" rx="10" fill="#ffffff" stroke="#b8c7db" stroke-width="1.5"/><text x="246" y="410" class="label" text-anchor="start">2N2222</text><text x="246" y="438" class="small" text-anchor="start">C：上／B：左</text><text x="246" y="463" class="small" text-anchor="start">E：下</text><polyline points="290,470 290,490" class="wire" style="stroke:#52627b"/><polyline points="290,490 290,502" class="wire" style="stroke:#52627b"/><polyline points="273,502 307,502" class="wire" style="stroke:#52627b"/><polyline points="279,509 301,509" class="wire" style="stroke:#52627b"/><polyline points="285,516 295,516" class="wire" style="stroke:#52627b"/><text x="50" y="395" class="label" text-anchor="start">GPIO10</text><polyline points="55,430 67,430" class="wire" style="stroke:#52627b"/><rect x="67" y="421" width="66" height="18" fill="white" stroke="#52627b" stroke-width="2"/><polyline points="133,430 145,430" class="wire" style="stroke:#52627b"/><text x="100" y="410" class="" text-anchor="middle">1kΩ</text><polyline points="145,430 230,430" class="wire" style="stroke:#52627b"/><text x="368" y="375" class="small" text-anchor="start">C</text><text x="765" y="125" class="label" text-anchor="middle">右 IR LED</text><text x="765" y="160" class="" text-anchor="middle">+5V</text><polyline points="765,170 765,180" class="wire" style="stroke:#be4d32"/><polyline points="765,180 765,192" class="wire" style="stroke:#52627b"/><rect x="756" y="192" width="18" height="46" fill="white" stroke="#52627b" stroke-width="2"/><polyline points="765,238 765,250" class="wire" style="stroke:#52627b"/><text x="787" y="220" class="" text-anchor="start">330Ω</text><polyline points="765,250 765,270" class="wire" style="stroke:#52627b"/><rect x="700" y="270" width="130" height="78" rx="10" fill="#ffffff" stroke="#b8c7db" stroke-width="1.5"/><text x="716" y="300" class="label" text-anchor="start">IR LED</text><text x="716" y="328" class="small" text-anchor="start">上 A／下 K</text><polyline points="765,348 765,380" class="wire" style="stroke:#52627b"/><rect x="705" y="380" width="130" height="90" rx="10" fill="#ffffff" stroke="#b8c7db" stroke-width="1.5"/><text x="721" y="410" class="label" text-anchor="start">2N2222</text><text x="721" y="438" class="small" text-anchor="start">C：上／B：左</text><text x="721" y="463" class="small" text-anchor="start">E：下</text><polyline points="765,470 765,490" class="wire" style="stroke:#52627b"/><polyline points="765,490 765,502" class="wire" style="stroke:#52627b"/><polyline points="748,502 782,502" class="wire" style="stroke:#52627b"/><polyline points="754,509 776,509" class="wire" style="stroke:#52627b"/><polyline points="760,516 770,516" class="wire" style="stroke:#52627b"/><text x="525" y="395" class="label" text-anchor="start">GPIO11</text><polyline points="530,430 542,430" class="wire" style="stroke:#52627b"/><rect x="542" y="421" width="66" height="18" fill="white" stroke="#52627b" stroke-width="2"/><polyline points="608,430 620,430" class="wire" style="stroke:#52627b"/><text x="575" y="410" class="" text-anchor="middle">1kΩ</text><polyline points="620,430 705,430" class="wire" style="stroke:#52627b"/><text x="843" y="375" class="small" text-anchor="start">C</text><text x="32" y="565" class="small" text-anchor="start">E/B/Cは機能端子名です。実部品の端子順はメーカー・パッケージ・見る方向をデータシートで確認。</text><text x="32" y="590" class="small" text-anchor="start">LED電流は順方向電圧・定格と合わせて確認します。5V電源GNDとESP32 GNDは共通。</text></svg>
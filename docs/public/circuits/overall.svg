<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 790" role="img" aria-labelledby="title desc"><title id="title">Deneuve 2 — 全体接続図</title><desc id="desc">実線：指定済みの電気接続／破線：光・機械・誘引の関係。機能回路の詳細は下の各図を参照。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#52627b"/></marker></defs><style>text{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;fill:#172b4d;font-size:17px}.small{font-size:14px}.label{font-size:20px;font-weight:700}.title{font-size:28px;font-weight:750}.muted{fill:#52627b} .wire{fill:none;stroke:#52627b;stroke-width:2.5;stroke-linejoin:round}</style><rect width="1000" height="790" rx="18" fill="#f5f8fc"/><text x="32" y="45" class="title" text-anchor="start">Deneuve 2 — 全体接続図</text><text x="32" y="74" class="small" text-anchor="start">実線：指定済みの電気接続／破線：光・機械・誘引の関係。機能回路の詳細は下の各図を参照。</text><rect x="32" y="120" width="250" height="110" rx="10" fill="#ffffff" stroke="#b8c7db" stroke-width="1.5"/><text x="48" y="150" class="label" text-anchor="start">受光部 PT1〜PT18</text><text x="48" y="178" class="small" text-anchor="start">各100kΩ → 3.3V</text><text x="48" y="203" class="small" text-anchor="start">コレクタ → MUX入力</text><text x="48" y="228" class="small" text-anchor="start">エミッタ → 共通GND</text><rect x="350" y="120" width="255" height="110" rx="10" fill="#ffffff" stroke="#b8c7db" stroke-width="1.5"/><text x="366" y="150" class="label" text-anchor="start">CD74HC4067 × 2</text><text x="366" y="178" class="small" text-anchor="start">MUX1 C0〜15：PT1〜16</text><text x="366" y="203" class="small" text-anchor="start">MUX2 C0〜1：PT17〜18</text><text x="366" y="228" class="small" text-anchor="start">VCC=3.3V／EN=GND</text><polyline points="282,175 350,175" class="wire" style="stroke:#52627b" marker-end="url(#arrow)"/><rect x="680" y="120" width="285" height="330" rx="10" fill="#ffffff" stroke="#b8c7db" stroke-width="1.5"/><text x="696" y="150" class="label" text-anchor="start">ESP32-S3 Board Lite</text><text x="696" y="178" class="small" text-anchor="start">GPIO1 ← MUX1 SIG</text><text x="696" y="203" class="small" text-anchor="start">GPIO2 ← MUX2 SIG</text><text x="696" y="228" class="small" text-anchor="start"></text><text x="696" y="253" class="small" text-anchor="start">GPIO6/7/8/9 → 共通S0/1/2/3</text><text x="696" y="278" class="small" text-anchor="start"></text><text x="696" y="303" class="small" text-anchor="start">GPIO10 → 左IR LED制御</text><text x="696" y="328" class="small" text-anchor="start">GPIO11 → 右IR LED制御</text><text x="696" y="353" class="small" text-anchor="start">GPIO16 → サーボ信号</text><text x="696" y="378" class="small" text-anchor="start">Flash 16MB／OPI PSRAM 8MB</text><polyline points="605,158 680,158" class="wire" style="stroke:#52627b" marker-end="url(#arrow)"/><polyline points="680,250 628,250 628,210 605,210" class="wire" style="stroke:#52627b" marker-end="url(#arrow)"/><rect x="350" y="310" width="255" height="115" rx="10" fill="#ffffff" stroke="#b8c7db" stroke-width="1.5"/><text x="366" y="340" class="label" text-anchor="start">IR LED × 2</text><text x="366" y="368" class="small" text-anchor="start">各：5V → 330Ω → LED</text><text x="366" y="393" class="small" text-anchor="start">→ 2N2222 C／E → GND</text><text x="366" y="418" class="small" text-anchor="start">GPIO → 1kΩ → B</text><polyline points="680,335 605,335" class="wire" style="stroke:#52627b" marker-end="url(#arrow)"/><polyline points="350,365 150,365 150,230" class="wire" style="stroke:#52627b" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="175" y="350" class="small" text-anchor="start">照射・遮光</text><rect x="350" y="485" width="255" height="100" rx="10" fill="#ffffff" stroke="#b8c7db" stroke-width="1.5"/><text x="366" y="515" class="label" text-anchor="start">サーボ × 1</text><text x="366" y="543" class="small" text-anchor="start">赤=5V／黒・茶=共通GND</text><text x="366" y="568" class="small" text-anchor="start">信号=GPIO16</text><polyline points="680,390 650,390 650,520 605,520" class="wire" style="stroke:#52627b" marker-end="url(#arrow)"/><rect x="680" y="485" width="285" height="100" rx="10" fill="#ffffff" stroke="#b8c7db" stroke-width="1.5"/><text x="696" y="515" class="label" text-anchor="start">掃除機</text><text x="696" y="543" class="small" text-anchor="start">2回押す → 強吸引</text><text x="696" y="568" class="small" text-anchor="start">吸引後に1回押す → 停止</text><polyline points="605,555 680,555" class="wire" style="stroke:#52627b" marker-end="url(#arrow)" stroke-dasharray="7 5"/><rect x="32" y="485" width="250" height="160" rx="10" fill="#ffffff" stroke="#b8c7db" stroke-width="1.5"/><text x="48" y="515" class="label" text-anchor="start">誘引部（回路は設計中）</text><text x="48" y="543" class="small" text-anchor="start">人工皮膚：10cm角・36°C</text><text x="48" y="568" class="small" text-anchor="start">匂いは自然拡散／CO₂流路は別</text><text x="48" y="593" class="small" text-anchor="start">CO₂専用：555 → 駆動 → 5Vファン</text><text x="48" y="618" class="small" text-anchor="start">噴出口は近く／直風を避ける</text><rect x="32" y="685" width="933" height="75" rx="10" fill="#ffffff" stroke="#b8c7db" stroke-width="1.5"/><text x="48" y="715" class="label" text-anchor="start">電源・共通GND</text><text x="48" y="743" class="small" text-anchor="start">3.3V：MUX・受光抵抗／5V：LED・サーボ・拡散ファン。5V給電元・電流容量、ヒーター電源は未確定。</text></svg>